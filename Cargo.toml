[workspace]
members = [
    "crates/nigiri-rs",
    "crates/nigiri-rs-core",
    "crates/nigiri-rs-fixtures",
    "crates/nigiri-rs-lnd",
    "crates/nigiri-rs-macros",
    "tests/consumers/default",
    "tests/consumers/renamed",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/h4vismat/nigiri-rs"

[workspace.dependencies]
bitcoin = "0.32.7"
elements = "0.25.3"
tokio = "1.50.0"
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
url = "2.5.8"
nigiri-rs-core = { version = "0.4.1", path = "crates/nigiri-rs-core" }
nigiri-rs-lnd = { version = "0.2.0", path = "crates/nigiri-rs-lnd" }
nigiri-rs-fixtures = { version = "0.3.0", path = "crates/nigiri-rs-fixtures" }
nigiri-rs-macros = { version = "0.3.0", path = "crates/nigiri-rs-macros" }
