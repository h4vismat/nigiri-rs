[package]
name = "nigiri-rs-fixtures"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ephemeral Bitcoin, Liquid, peg, and Lightning regtest fixtures for nigiri-rs"
repository.workspace = true

[features]
default = []
lnd = ["dep:nigiri-rs-lnd", "dep:getrandom"]
# Enables real-Docker tests; ordinary library tests use fake engines.
docker-tests = []
bitcoin-rpc-types = ["nigiri-rs-core/bitcoin-rpc-types"]

[dependencies]
bitcoin = { workspace = true, features = ["serde"] }
bollard = "0.20.2"
futures-util = "0.3.32"
getrandom = { version = "0.3.3", optional = true }
nigiri-rs-core = { workspace = true }
nigiri-rs-lnd = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tar = "0.4.44"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = { workspace = true }
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
# `bitcoin`/`elements` give the fixture tests native typed values (amounts, txids, block hashes) to
# assert against. `tokio/test-util` is the pausable clock the deadline test in src/electrum.rs
# drives with `start_paused` and `time::advance`; the library itself needs `tokio/net` for the
# Electrum probe, but not the rest.
elements = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "bitcoin_fixture"
required-features = ["docker-tests"]

[[test]]
name = "liquid_fixture"
required-features = ["docker-tests"]

[[test]]
name = "peg_pair"
required-features = ["docker-tests"]

[[test]]
name = "peg_wiring"
required-features = ["docker-tests"]

[[test]]
name = "lnd_pair"
required-features = ["docker-tests", "lnd"]

[[test]]
name = "lnd_wiring"
required-features = ["docker-tests", "lnd"]
