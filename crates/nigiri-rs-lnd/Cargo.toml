[package]
name = "nigiri-rs-lnd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed host-managed LND client with protocol-level Lightning records"
readme = "README.md"
repository.workspace = true

[dependencies]
bitcoin = { workspace = true }
lightning-invoice = "0.34.1"
prost = "0.14.1"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
url = { workspace = true }

[dev-dependencies]
h2 = "0.4"
rcgen = "0.14.5"
tokio-stream = { version = "0.1.17", features = ["net"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
