[package]
name = "nigiri-rs"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed Bitcoin, Liquid, and Lightning regtest clients with optional Docker fixtures"
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
bitcoin-rpc-types = ["nigiri-rs-core/bitcoin-rpc-types"]
lnd = ["dep:nigiri-rs-lnd"]
fixtures = ["dep:nigiri-rs-fixtures", "dep:nigiri-rs-macros", "dep:tokio"]

lightning-fixtures = ["fixtures", "lnd", "nigiri-rs-fixtures/lnd"]
docker-tests = ["fixtures", "nigiri-rs-fixtures/docker-tests"]

[dependencies]
nigiri-rs-core = { workspace = true }
nigiri-rs-fixtures = { workspace = true, optional = true }
nigiri-rs-lnd = { workspace = true, optional = true }
nigiri-rs-macros = { workspace = true, optional = true }
# Re-exported through `__private` so generated code can annotate its wrapper with `#[tokio::test]`
# without the consumer adding tokio themselves. `macros` supplies the attribute; `rt` and
# `rt-multi-thread` supply the runtimes it selects between.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"], optional = true }

[dev-dependencies]
# `bitcoin`/`elements` give the macro tests native typed values (amounts, block hashes) to assert
# against, and `serde`/`serde_json` build the raw-transaction payloads the Liquid contract test
# sends. These are the dependencies a real consumer of the macro would also declare themselves.
bitcoin = { workspace = true, features = ["serde"] }
elements = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The macro's own generated code reaches tokio through `__private`; this entry is for test bodies
# that call tokio directly, which a consumer would get from their own dev-dependencies.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[[test]]
name = "macro_smoke"
required-features = ["docker-tests"]
