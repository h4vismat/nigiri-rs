[package]
name = "nigiri-rs-core"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Typed Bitcoin and Liquid regtest service clients"
repository = "https://github.com/h4vismat/nigiri-rs"

[features]
default = []
bitcoin-rpc-types = ["dep:corepc-types"]

[dependencies]
bitcoin = { version = "0.32.7", features = ["serde"] }
corepc-types = { version = "0.15.0", optional = true }
elements = { version = "0.25.3", features = ["serde"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["io-util", "macros", "net", "process", "rt", "test-util", "time"] }
url = "2.5.8"

[dev-dependencies]
# The library itself only ever needs a current-thread runtime (driven by `#[tokio::test]` or a
# fixture's own executor), so `rt-multi-thread` stays out of the main dependency's feature set.
# `examples/peg_smoke.rs` uses plain `#[tokio::main]`, whose default flavor needs it.
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
