[package]
name = "nigiri-rs-core"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed Bitcoin and Liquid regtest service clients"
repository.workspace = true

[features]
default = []
bitcoin-rpc-types = ["dep:corepc-types"]

[dependencies]
bitcoin = { workspace = true, features = ["serde"] }
corepc-types = { version = "0.15.0", optional = true }
elements = { workspace = true, features = ["serde"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true }

[dev-dependencies]
# Mock servers, paused-clock tests, and the example runtime are test-only.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util"] }
