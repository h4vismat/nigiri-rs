[package]
name = "nigiri-testcontainers"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Ephemeral Bitcoin regtest fixtures for nigiri-rs"
repository = "https://github.com/h4vismat/nigiri-rs"

[features]
default = []
bitcoin-rpc-types = ["nigiri-rs/bitcoin-rpc-types"]

[dependencies]
nigiri-rs = { version = "0.3.0", path = "../.." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
testcontainers = "0.27.3"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
# Only the tests drive an HTTP client, subprocesses, and the pausable clock. The library itself needs
# `tokio/net` for the Electrum probe, but not the rest.
bitcoin = { version = "0.32.7", features = ["serde"] }
elements = { version = "0.25.3", features = ["serde"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["process", "test-util"] }
