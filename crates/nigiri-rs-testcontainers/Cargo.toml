[package]
name = "nigiri-rs-testcontainers"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Ephemeral Bitcoin and Liquid regtest fixtures for nigiri-rs"
repository = "https://github.com/h4vismat/nigiri-rs"

[features]
default = []
bitcoin-rpc-types = ["nigiri-rs-core/bitcoin-rpc-types"]

[dependencies]
nigiri-rs-core = { version = "0.3.0", path = "../nigiri-rs-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
testcontainers = "0.27.3"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
# `bitcoin`/`elements` give the fixture tests native typed values (amounts, txids, block hashes) to
# assert against. `tokio/test-util` is the pausable clock the deadline test in src/electrum.rs
# drives with `start_paused` and `time::advance`; the library itself needs `tokio/net` for the
# Electrum probe, but not the rest.
bitcoin = { version = "0.32.7", features = ["serde"] }
elements = { version = "0.25.3", features = ["serde"] }
tokio = { version = "1.50.0", features = ["test-util"] }
