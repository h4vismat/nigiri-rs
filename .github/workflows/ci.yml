name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets any job be rerun on demand against a branch without waiting for a
  # merge to master.
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just in the clippy job.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Check facade feature boundaries
        run: |
          cargo check -p nigiri-rs --no-default-features
          for features in fixtures lnd lightning-fixtures bitcoin-rpc-types fixtures,bitcoin-rpc-types; do
            cargo check -p nigiri-rs --no-default-features --features "$features"
          done

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Cover optional APIs as well as code compiled without those features.
      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The declared MSRV and stable both run default workspace tests without Docker.
        # MSRV all-features checks protocol/macros behavior; its build still covers all targets.
        # Stable all-features explicitly enables the live Docker suite and runs it serially.
        include:
          - toolchain: "1.88"
            features: default
            cargo_features: ""
            scope: --workspace
            test_args: ""
          - toolchain: "1.88"
            features: all
            cargo_features: --all-features
            scope: -p nigiri-rs-core -p nigiri-rs-lnd -p nigiri-rs-macros
            test_args: ""
          - toolchain: stable
            features: default
            cargo_features: ""
            scope: --workspace
            test_args: ""
          # The only cell that runs Docker-backed tests also uses the release gate's proven
          # single Rust test thread so concurrent cold fixture startups do not saturate Docker.
          - toolchain: stable
            features: all
            cargo_features: --all-features
            scope: --workspace
            test_args: -- --test-threads=1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.features }}

      # --workspace here even on the narrowed cells: every toolchain should still prove the
      # whole workspace compiles, which is most of what the 1.88 floor is guarding.
      - name: cargo build
        run: cargo build --workspace --all-targets ${{ matrix.cargo_features }}

      # Live tests require docker-tests; default workspace tests use fake engines only.
      # The all-features workspace cell runs real containers serially.
      - name: cargo test
        run: cargo test ${{ matrix.scope }} --all-targets ${{ matrix.cargo_features }} ${{ matrix.test_args }}

      - name: cargo test --doc
        run: cargo test --workspace --doc ${{ matrix.cargo_features }}

  packaging:
    name: Package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: packaging

      # Catches missing files, bad metadata, and anything excluded from the published tarball that
      # the crate actually needs to build. Both protocol crates and macros have no unpublished
      # workspace dependency. The facade and fixtures resolve their protocol dependencies through
      # crates.io even under --no-verify, so their publish order is: core + lnd, then fixtures,
      # then facade. Macros may publish independently.
      - name: cargo package nigiri-rs-core
        run: cargo package -p nigiri-rs-core --all-features

      - name: cargo package nigiri-rs-lnd
        run: cargo package -p nigiri-rs-lnd --all-features

      - name: cargo package nigiri-rs-macros
        run: cargo package -p nigiri-rs-macros --all-features

      - name: cargo metadata
        run: cargo metadata --no-deps --format-version 1 > /dev/null
