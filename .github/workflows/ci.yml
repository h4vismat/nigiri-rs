name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets any job be rerun on demand against a branch without waiting for a
  # merge to master.
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just in the clippy job.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # --all-features so the bitcoin-rpc-types surface is linted too.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.88 is the rust-version floor declared in Cargo.toml. stable catches
        # regressions from newer compilers.
        toolchain: ["1.88", stable]
        # Default features alone never compile tests/rpc_types_feature.rs or the
        # gated test in tests/rpc_api.rs, so both columns are required to know the
        # optional feature still works.
        features: [default, all]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.features }}

      - name: Set feature and scope flags
        id: flags
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            echo "cargo_features=--all-features" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_features=" >> "$GITHUB_OUTPUT"
          fi
          # Exactly one cell runs the Docker-backed tests. The others are scoped to the core
          # crate, which is where both things this matrix exists for live: the 1.88 floor and
          # the bitcoin-rpc-types feature. Scoping by package rather than by test name is
          # deliberate — a name filter that stops matching exits 0 and reports green.
          if [ "${{ matrix.toolchain }}" = "stable" ] && [ "${{ matrix.features }}" = "all" ]; then
            echo "test_scope=--workspace" >> "$GITHUB_OUTPUT"
          else
            echo "test_scope=-p nigiri-rs-core" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo build
        run: cargo build --workspace --all-targets ${{ steps.flags.outputs.cargo_features }}

      # Nothing is #[ignore]d any more, so whichever scope this cell got decides whether it
      # starts containers. Only stable+all is --workspace, and only that cell needs Docker.
      - name: cargo test
        run: cargo test ${{ steps.flags.outputs.test_scope }} --all-targets ${{ steps.flags.outputs.cargo_features }}

      - name: cargo test --doc
        run: cargo test --workspace --doc ${{ steps.flags.outputs.cargo_features }}

  packaging:
    name: Package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: packaging

      # Catches missing files, bad metadata, and anything excluded from the published tarball that
      # the crate actually needs to build. nigiri-rs-core and nigiri-rs-macros can be packaged
      # today: neither has a path dependency. The facade and the fixtures both depend on
      # unpublished nigiri-rs-core, and `cargo package` resolves that requirement against
      # crates.io even under --no-verify. They become packageable in publish order: core, then
      # macros and fixtures, then the facade. Their metadata is still checked by the workspace
      # build and by `cargo metadata` below.
      - name: cargo package nigiri-rs-core
        run: cargo package -p nigiri-rs-core --all-features

      - name: cargo package nigiri-rs-macros
        run: cargo package -p nigiri-rs-macros --all-features

      - name: cargo metadata
        run: cargo metadata --no-deps --format-version 1 > /dev/null
