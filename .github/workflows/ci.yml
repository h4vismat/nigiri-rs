name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets the host suites be run on demand against a branch without waiting for a
  # merge to master.
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just in the clippy job.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # --all-features so the bitcoin-rpc-types surface is linted too.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.88 is the rust-version floor declared in Cargo.toml. stable catches
        # regressions from newer compilers.
        toolchain: ["1.88", stable]
        # Default features alone never compile tests/rpc_types_feature.rs or the
        # gated test in tests/rpc_api.rs, so both columns are required to know the
        # optional feature still works.
        features: [default, all]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.features }}

      - name: Set feature flag
        id: flags
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            echo "cargo_features=--all-features" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_features=" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo build
        run: cargo build --workspace --all-targets ${{ steps.flags.outputs.cargo_features }}

      # Host suites are #[ignore] and need a running Nigiri, so they stay out of
      # this job. The host-tests job below covers them.
      - name: cargo test
        run: cargo test --workspace --all-targets ${{ steps.flags.outputs.cargo_features }}

      - name: cargo test --doc
        run: cargo test --workspace --doc ${{ steps.flags.outputs.cargo_features }}

  packaging:
    name: Package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: packaging

      # Catches missing files, bad metadata, and anything excluded from the
      # published tarball that the crate actually needs to build.
      - name: cargo package nigiri-rs
        run: cargo package -p nigiri-rs --all-features

      # --no-verify because verification would build the archive against a published nigiri-rs,
      # and the path dependency it needs is not on crates.io yet.
      - name: cargo package nigiri-testcontainers
        run: cargo package -p nigiri-testcontainers --all-features --no-verify

  bitcoin-fixture:
    name: Bitcoin fixture suite
    runs-on: ubuntu-latest
    # Docker is preinstalled on the runner and is the only external service needed: each test starts
    # its own regtest stack, so there is no Nigiri to install and no Compose file to bring up.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bitcoin-fixture

      # --test-threads=1 keeps image pulls and container starts sequential on a shared runner.
      - name: Bitcoin fixture suite
        run: cargo test -p nigiri-testcontainers --test bitcoin_fixture --all-features -- --ignored --test-threads=1 --nocapture

      # Proves the ephemeral promise: this one lives inside the crate because the identifiers of what
      # a fixture created are deliberately not public.
      - name: Fixture teardown proof
        run: cargo test -p nigiri-testcontainers --lib --all-features dropping_a_fixture_removes_every_resource_it_created -- --ignored --nocapture

  host-tests:
    name: Liquid host suite against live Nigiri
    runs-on: ubuntu-latest
    # Only on master and on demand: booting Nigiri pulls several container images and the Liquid
    # suite needs exclusive access to one chain. Bitcoin no longer runs here.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: host-tests

      - name: Install Nigiri
        run: |
          curl https://getnigiri.vulpem.com | bash
          echo "$HOME/.nigiri" >> "$GITHUB_PATH"

      - name: Start Nigiri with Liquid
        run: nigiri start --liquid

      - name: Wait for Esplora endpoints
        run: |
          for port in 30000 30001; do
            for _ in $(seq 1 60); do
              if curl -fsS "http://localhost:$port/blocks/tip/height" >/dev/null 2>&1; then
                echo "port $port ready"
                break
              fi
              sleep 5
            done
            curl -fsS "http://localhost:$port/blocks/tip/height" >/dev/null
          done

      # --test-threads=1 is mandatory: the Liquid suite still reorgs a shared chain.
      - name: Liquid host suite
        run: cargo test --test host_liquid --all-features -- --ignored --test-threads=1

      - name: Stop Nigiri
        if: always()
        run: nigiri stop --delete
