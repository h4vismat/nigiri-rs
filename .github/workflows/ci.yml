name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets any job be rerun on demand against a branch without waiting for a
  # merge to master.
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just in the clippy job.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # --all-features so the bitcoin-rpc-types surface is linted too.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 1.88 is the rust-version floor declared in Cargo.toml; stable catches regressions
        # from newer compilers. Default features alone never compile
        # tests/rpc_types_feature.rs or the gated test in tests/rpc_api.rs, so both feature
        # columns are required to know the optional feature still works.
        #
        # Each cell states its own test scope instead of deriving it from the toolchain and
        # feature names. A derived condition re-scopes every cell the moment a matrix value
        # is renamed, and does it silently; stated data cannot drift out from under itself.
        #
        # Scoping by package, never by test name: a wrong package name is a hard error,
        # whereas a name filter that stops matching selects nothing and exits 0.
        # nigiri-rs-macros is in the cheap cells because its trybuild suite is pure rustc
        # compile-fail checking with no Docker in it, and macro diagnostics are exactly the
        # thing worth checking against the 1.88 floor as well as stable.
        include:
          - toolchain: "1.88"
            features: default
            cargo_features: ""
            scope: -p nigiri-rs-core -p nigiri-rs-macros
          - toolchain: "1.88"
            features: all
            cargo_features: --all-features
            scope: -p nigiri-rs-core -p nigiri-rs-macros
          - toolchain: stable
            features: default
            cargo_features: ""
            scope: -p nigiri-rs-core -p nigiri-rs-macros
          # The only cell that runs the Docker-backed tests.
          - toolchain: stable
            features: all
            cargo_features: --all-features
            scope: --workspace
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.features }}

      # --workspace here even on the narrowed cells: every toolchain should still prove the
      # whole workspace compiles, which is most of what the 1.88 floor is guarding.
      - name: cargo build
        run: cargo build --workspace --all-targets ${{ matrix.cargo_features }}

      # Nothing is #[ignore]d any more, so this cell's scope is what decides whether it
      # starts containers.
      - name: cargo test
        run: cargo test ${{ matrix.scope }} --all-targets ${{ matrix.cargo_features }}

      - name: cargo test --doc
        run: cargo test --workspace --doc ${{ matrix.cargo_features }}

  packaging:
    name: Package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: packaging

      # Catches missing files, bad metadata, and anything excluded from the published tarball that
      # the crate actually needs to build. nigiri-rs-core and nigiri-rs-macros can be packaged
      # today: neither has a path dependency. The facade and the fixtures both depend on
      # unpublished nigiri-rs-core, and `cargo package` resolves that requirement against
      # crates.io even under --no-verify. They become packageable in publish order: core, then
      # macros and fixtures, then the facade. Their metadata is still checked by the workspace
      # build and by `cargo metadata` below.
      - name: cargo package nigiri-rs-core
        run: cargo package -p nigiri-rs-core --all-features

      - name: cargo package nigiri-rs-macros
        run: cargo package -p nigiri-rs-macros --all-features

      - name: cargo metadata
        run: cargo metadata --no-deps --format-version 1 > /dev/null
