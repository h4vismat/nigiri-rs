name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets any job be rerun on demand against a branch without waiting for a
  # merge to master.
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just in the clippy job.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # --all-features so the bitcoin-rpc-types surface is linted too.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.88 is the rust-version floor declared in Cargo.toml. stable catches
        # regressions from newer compilers.
        toolchain: ["1.88", stable]
        # Default features alone never compile tests/rpc_types_feature.rs or the
        # gated test in tests/rpc_api.rs, so both columns are required to know the
        # optional feature still works.
        features: [default, all]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.features }}

      - name: Set feature flag
        id: flags
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            echo "cargo_features=--all-features" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_features=" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo build
        run: cargo build --workspace --all-targets ${{ steps.flags.outputs.cargo_features }}

      # Fixture suites are #[ignore] and start their own Docker containers, so they stay out of
      # this job. The fixture-suites job below covers them.
      - name: cargo test
        run: cargo test --workspace --all-targets ${{ steps.flags.outputs.cargo_features }}

      - name: cargo test --doc
        run: cargo test --workspace --doc ${{ steps.flags.outputs.cargo_features }}

  packaging:
    name: Package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: packaging

      # Catches missing files, bad metadata, and anything excluded from the
      # published tarball that the crate actually needs to build.
      - name: cargo package nigiri-rs
        run: cargo package -p nigiri-rs --all-features

      # nigiri-rs-testcontainers is deliberately not packaged here. Packaging resolves its
      # `nigiri-rs = "0.3.0"` requirement against crates.io even under --no-verify, and only 0.2.0
      # is published, so the step cannot pass until nigiri-rs is released. Its metadata is still
      # checked by the workspace build and by `cargo metadata` below.
      - name: cargo metadata
        run: cargo metadata --no-deps --format-version 1 > /dev/null

  fixture-suites:
    name: Fixture suites (Docker)
    runs-on: ubuntu-latest
    # Docker is preinstalled on the runner and is the only external service needed: each test starts
    # its own regtest stack, so there is no Nigiri to install and no Compose file to bring up.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: fixture-suites

      # --test-threads=1 keeps image pulls and container starts sequential on a shared runner.
      - name: Bitcoin fixture suite
        run: cargo test -p nigiri-rs-testcontainers --test bitcoin_fixture --all-features -- --ignored --test-threads=1 --nocapture

      - name: Liquid fixture suite
        run: cargo test -p nigiri-rs-testcontainers --test liquid_fixture --all-features -- --ignored --test-threads=1 --nocapture

      # Proves the ephemeral promise for both chains, and runs every other ignored lib test (e.g.
      # the end-to-end Bitcoin readiness proof): these live inside the crate because the
      # identifiers of what a fixture created are deliberately not public.
      - name: Ignored lib tests (fixture teardown and readiness proofs)
        run: cargo test -p nigiri-rs-testcontainers --lib --all-features -- --ignored --test-threads=1 --nocapture
